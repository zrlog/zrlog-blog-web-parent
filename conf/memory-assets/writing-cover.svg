<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"
     aria-labelledby="title desc">
    <title id="title">把文章留给自己的站点</title>
    <desc id="desc">蓝紫色渐变背景上的 ZrLog 与 A Place to Write 字样</desc>
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#172033"/>
            <stop offset="0.55" stop-color="#3158a5"/>
            <stop offset="1" stop-color="#8b5cf6"/>
        </linearGradient>
    </defs>
    <rect width="1200" height="720" rx="42" fill="url(#bg)"/>
    <circle cx="980" cy="120" r="210" fill="#fff" opacity=".08"/>
    <circle cx="1080" cy="620" r="280" fill="#fff" opacity=".06"/>
    <text x="92" y="310" fill="#fff" font-family="system-ui,sans-serif" font-size="82" font-weight="700">ZrLog</text>
    <text x="92" y="404" fill="#dbeafe" font-family="system-ui,sans-serif" font-size="54">A Place to Write</text>
    <text x="94" y="500" fill="#bfdbfe" font-family="system-ui,sans-serif" font-size="30">Write · Publish · Keep</text>
</svg>
